name: Learn Github Actions

on:
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      
      - name: Setup NASM
        uses: ilammy/setup-nasm@v1.5.2

      - name: Test VS 1
        continue-on-error: true
        run: msbuild --version

      - name: Test VS 2
        continue-on-error: true
        run: nmake --version

      - name: Test MASM
        continue-on-error: true
        run: nasm -v

      - name: Search MS VS Dir
        continue-on-error: true
        run: |
          Get-Content "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
